name: Public discovery diagnostic
on:
  workflow_dispatch:
permissions: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Observe public discovery responses
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          targets = [
              ('https://awesomerea.org/', 'awesome'),
              ('https://awesomerea.org/robots.txt', 'user-agent:'),
              ('https://awesomerea.org/sitemap.xml', 'https://awesomerea.org/zh/contribute/'),
              ('https://awesomerea.org/llms.txt', '/blob/main/agents.md'),
              ('https://awesomerea.org/contribute/', 'choose a submission form'),
              ('https://awesomerea.org/zh/contribute/', '选择提交入口'),
          ]
          rows = []
          for url, marker in targets:
              row = {'url': url}
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'AwesomeREA-public-discovery-check/1.0'})
                  with urllib.request.urlopen(request, timeout=12) as response:
                      sample = response.read(32768).decode('utf-8', 'replace')
                      row.update(status=response.status, content_type=response.headers.get('Content-Type'),
                                 expected_content=marker in sample.lower())
              except urllib.error.HTTPError as error:
                  row.update(status=error.code, expected_content=False)
              except Exception as error:
                  row.update(error=type(error).__name__, expected_content=False)
              rows.append(row)
          print(json.dumps(rows, indent=2))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Public discovery HTTP observation\n\n| URL | Status | Expected content |\n| --- | --- | --- |\n')
              for row in rows:
                  summary.write('| ' + row['url'] + ' | ' + str(row.get('status', row.get('error'))) + ' | ' + str(row['expected_content']) + ' |\n')
              summary.write('\nThis checks ordinary HTTP access from this runner. It does not establish search indexing or genuine crawler access.\n')
          raise SystemExit(0 if all(row.get('status') == 200 and row['expected_content'] for row in rows) else 1)
          PY

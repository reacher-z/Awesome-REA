name: GitHub Pages mirror
# Publishes the Cloudflare Pages production build on this repository's GitHub Pages site, which serves
# the secondary awesome-rea.com domain. Every page keeps its https://awesomerea.org canonical links.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# One deployment at a time: a running deployment is never cancelled, and a newer queued run replaces an
# older queued one, so the latest main commit is the last one published.
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: ${{ !github.event.repository.fork && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # The Cloudflare Pages build command and output directory, so both hosts serve the same files.
      - name: Run the production build
        run: python3 scripts/build_production.py --fontawesome-assets-url https://awesome-rea.pages.dev
      # GitHub Pages does not apply Cloudflare's header and redirect rules; it would serve them as files.
      - name: Remove the Cloudflare Pages rule files
        run: rm -f dist/_headers dist/_redirects
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the build on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

name: Catalog checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equivalence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Build the site
        run: |
          python3 scripts/classify_scan_evidence.py
          python3 scripts/fetch_previews.py
          python3 scripts/build_site.py
      - name: Compare the base and new validate_site.py
        run: |
          git show d087cca210d427c78fb7be242d7470fc409c6e9c:scripts/validate_site.py > scripts/validate_site_old.py
          python3 scripts/equivalence_harness.py
      - name: Diff
        run: |
          wc -l equivalence/old/parsers.txt equivalence/new/parsers.txt
          ls equivalence/old equivalence/new
          for f in equivalence/new/main-*.txt; do echo "$(basename $f): $(head -c 300 $f | head -1)"; done
          echo '$ diff -r equivalence/old equivalence/new'
          diff -r equivalence/old equivalence/new && echo "(no output: the trees are identical)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: equivalence
          path: equivalence/

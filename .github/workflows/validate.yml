name: Catalog checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# PR runs share one group per pull request, so a newer push cancels the superseded run.
# Every main run gets its own group and is never cancelled or replaced by a later push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Compile Python scripts and tests
        run: python3 -m compileall -q scripts tests
      # tests/unit_shards.py keeps each test class in one shard, balances the shards by class weight and
      # checks that the shards are non-empty, pairwise disjoint and together equal the whole discovery.
      - name: Run unit tests
        env:
          CI_TEST_SHARD: ${{ matrix.shard }}
          CI_TEST_SHARDS: ${{ strategy.job-total }}
        run: python3 tests/unit_shards.py
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # The Cloudflare Pages build command: validate.py, node --check, build_site.py,
      # validate_discovery.py and validate_site.py. The asset URL is only written into HTML.
      - name: Run the production build
        run: python3 scripts/build_production.py --fontawesome-assets-url https://awesome-rea.pages.dev
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # The smoke test rebuilds dist/ with the public fallback icons and loads it in the runner's installed
      # Chrome; the pinned puppeteer-core package downloads no browser. CI=true makes a missing Chrome fail.
      - name: Install the browser smoke-test driver
        run: npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - name: Run the browser smoke test
        run: node tests/browser/smoke.cjs
      - name: Keep browser smoke-test screenshots for review
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-screenshots
          path: .cache/browser-smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
  # Keep the required check name. A failed, skipped or cancelled dependency
  # must never turn into a successful aggregate result.
  validate:
    needs: [unit, production, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every catalog check to pass
        env:
          CI_UNIT_RESULT: ${{ needs.unit.result }}
          CI_PRODUCTION_RESULT: ${{ needs.production.result }}
          CI_BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          for result in "$CI_UNIT_RESULT" "$CI_PRODUCTION_RESULT" "$CI_BROWSER_RESULT"; do
            if [ "$result" != success ]; then
              echo '::error::Every catalog check must succeed.'
              exit 1
            fi
          done

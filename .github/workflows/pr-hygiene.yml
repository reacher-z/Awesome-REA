name: PR hygiene
# Commit identity, commit trailers and the Codex review section of the pull request body
# (scripts/check_pr_hygiene.py). The job reads the pull request through the API and runs only the
# base branch's script; it never checks out or executes the pull request head.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pr-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check commit identities, commit trailers and the Codex review section
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_pr_hygiene.py

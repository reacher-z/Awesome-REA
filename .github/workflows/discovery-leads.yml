name: Followed-source lead discovery
on:
  workflow_dispatch:
    inputs:
      all_sources:
        description: Also follow the sources that run once a day or week (surveys, registries, Hugging Face)
        required: false
        type: boolean
        default: false
  # Every eight hours at minute 7 UTC, the same requested start as the README scan. Workflows requested for one
  # minute start within about two minutes of each other, this one finishes its ingest in about eight, and
  # the README scan reads for at least twelve before its own ingest, so the two ingests take turns on the
  # shared required-check runners. If they ever overlap, the later one rebuilds its batch and retries.
  schedule:
    - cron: '7 */8 * * *'
permissions:
  contents: read
concurrency:
  group: followed-source-lead-discovery
  cancel-in-progress: false
jobs:
  # Reads public sources only. Its token cannot write; upstream text is parsed here and never reaches a
  # job that can.
  collect:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      collection_ready: ${{ steps.collect.outputs.collection_ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Follow the registered sources
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
          ALL_SOURCES: ${{ inputs.all_sources && 'true' || 'false' }}
        run: python3 scripts/collect_discovery_leads.py collect
      - name: Keep the candidate leads for the ingest job
        if: ${{ steps.collect.outputs.collection_ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lead-candidates-${{ github.run_attempt }}
          path: .cache/discovery-leads/candidates.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
  ingest:
    needs: collect
    if: ${{ needs.collect.outputs.collection_ready == 'true' && !github.event.repository.fork && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: lead-candidates-${{ github.run_attempt }}
          path: .cache/discovery-leads
      - name: Add new leads through a checked pull request
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/collect_discovery_leads.py run
  report:
    needs: [collect, ingest]
    if: ${{ always() && !github.event.repository.fork && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Update the failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          INGEST_RESULT: ${{ needs.ingest.result }}
        run: python3 scripts/ingest_discoveries.py report --tracker discovery-leads --result "collect=$COLLECT_RESULT" --result "ingest=$INGEST_RESULT"

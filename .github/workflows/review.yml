name: Automated PR review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # A pull request opened with GITHUB_TOKEN, such as one opened by repository automation, starts no
  # pull_request_target run. Dispatch this workflow on the default branch instead: its definition and
  # code then come from that trusted branch, never from the PR, and the job reports its result as the
  # `review` check run on the PR head commit named here.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to review
        required: true
        type: string
      head_sha:
        description: Full SHA of the PR head commit to review; the review is refused if the PR has moved on
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true
jobs:
  review:
    if: ${{ github.event_name == 'pull_request_target' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Trusted BASE code and validators only. Never check out or execute the PR head.
      # Unchanged source/locale JSON is read from this base checkout when validating coverage.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # review_pr.py fetches its exact JSON allowlist, and the text of files whose diff GitHub omitted,
      # from the PR head as size-bounded data.
      - name: Review catalog and bilingual locale data without executing contributor code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/review_pr.py
  # Same review for a dispatched run. Only a dispatch on the default branch runs: this definition and
  # the checked-out code are then that branch's, and the PR head is still never checked out or executed.
  dispatched-review:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The inputs reach review_pr.py through the event payload, never through shell interpolation.
      - name: Review the named PR head and report the required review check on it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/review_pr.py

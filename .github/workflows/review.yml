name: Automated PR review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted BASE code and validators only. Never check out or execute the PR head.
      # Unchanged source/locale JSON is read from this base checkout when validating coverage.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # review_pr.py fetches its exact JSON allowlist, and the text of files whose diff GitHub omitted,
      # from the PR head as size-bounded data.
      - name: Review catalog and bilingual locale data without executing contributor code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/review_pr.py

name: Scheduled README discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '17 0,8,16 * * *'
      timezone: America/Los_Angeles
permissions:
  contents: read
  actions: read
concurrency:
  group: scheduled-readme-discovery
  cancel-in-progress: false
jobs:
  scan:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resume bounded public README discovery
        id: scan
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 scripts/scheduled_source_scan.py
      - name: Preserve validated incremental checkpoint
        if: ${{ always() && steps.scan.outputs.checkpoint_ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readme-scan-checkpoint-${{ github.run_attempt }}
          path: |
            .cache/scheduled-source-scan/checkpoint/checkpoint.json
            .cache/scheduled-source-scan/checkpoint/frontier.json
            .cache/scheduled-source-scan/checkpoint/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Preserve validated inputs when reconciliation needs review
        if: ${{ always() && hashFiles('.cache/scheduled-source-scan/review/*.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-scan-reconciliation-review
          path: .cache/scheduled-source-scan/review/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

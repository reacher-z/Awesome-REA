name: Public artifact lead discovery
on:
  workflow_dispatch:
  # Every eight hours at minute 7 UTC, the same requested start as the README scan.
  schedule:
    - cron: '7 */8 * * *'
permissions:
  contents: read
  discussions: read
concurrency:
  group: public-artifact-lead-discovery
  cancel-in-progress: false
jobs:
  collect:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Capture bounded public source links
        id: collect
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/collect_public_artifact_leads.py
      - name: Retain validated discovery snapshot
        if: ${{ always() && steps.collect.outputs.artifact_ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-artifact-leads-${{ github.run_attempt }}
          path: |
            .cache/public-artifact-leads/leads.json
            .cache/public-artifact-leads/receipt.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  # One tracking issue: updated on a failed run, closed by the next successful one.
  report:
    needs: collect
    if: ${{ always() && !github.event.repository.fork && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Update the failure tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          COLLECT_RESULT: ${{ needs.collect.result }}
        run: python3 scripts/ingest_discoveries.py report --tracker artifact-leads --result "collect=$COLLECT_RESULT"

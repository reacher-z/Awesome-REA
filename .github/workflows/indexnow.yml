name: Notify IndexNow
# Tells IndexNow (Bing, Yandex, Seznam, Naver, Yep and the other participating engines) which canonical
# pages a production deployment changed. merge-pr.yml and the discovery ingest start it with the merged
# commit; the schedule catches deployments made any other way. A run builds that commit as the publication
# workflows do, waits until awesomerea.org serves exactly that build, and diffs it against the build its previous
# receipt recorded, so only added or changed pages are sent. See docs/automation.md.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Deployed main commit to notify (default the current main head)
        required: false
        type: string
  schedule:
    - cron: '41 */3 * * *'
permissions:
  contents: read
# Runs queue instead of overlapping, so each diff starts from the receipt of the run before it.
concurrency:
  group: indexnow
  cancel-in-progress: false
jobs:
  notify:
    if: ${{ !github.event.repository.fork && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Find and download the receipt of the previous run.
      actions: read
    steps:
      - name: Choose the deployed commit
        id: commit
        env:
          INPUT_SHA: ${{ inputs.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          sha="${INPUT_SHA:-$HEAD_SHA}"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected a full 40-character commit SHA." && exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit of the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      # The Node version of the publication workflows, for the build's node --check.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      # The build of the publication workflows (Awesome-REA/awesomerea.org and Awesome-REA/awesome-rea.com), previews
      # included; star counts are left out of the page hashes. A preview that downloads in one build and not in the
      # other changes the page, which is why this build reads the served previews instead of downloading them.
      # The publication workflows install the same pinned Pillow for the preview thumbnails.
      - name: Install the publication build's Pillow
        run: |
          python3 -m pip install --disable-pip-version-check --no-deps --only-binary=:all: --require-hashes -r scripts/publish-requirements.txt
      # The build takes its preview images from the copies awesomerea.org serves (previews/sources.json), never from
      # the upstream hosts, so it holds the previews of the deployment whichever host was slow when it was built.
      - name: Wait until awesomerea.org serves the commit
        run: python3 scripts/indexnow_automation.py serving "$SHA"
        env:
          SHA: ${{ steps.commit.outputs.sha }}
      - name: Build the commit as the publication workflows do
        run: python3 scripts/build_production.py --publish --previews-from-site
      - name: Wait until awesomerea.org serves this build
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: python3 scripts/indexnow_automation.py wait "$SHA" dist
      - name: Fetch the previous receipt
        id: previous
        if: ${{ steps.deploy.outputs.state == 'live' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/indexnow_automation.py previous .cache/indexnow/previous
      - name: Notify IndexNow of added and changed pages
        if: ${{ steps.deploy.outputs.state == 'live' }}
        env:
          PREVIOUS_SHA256: ${{ steps.previous.outputs.previous_sha256 }}
        run: |
          args=(--submit --automatic --receipt .cache/indexnow/receipt/receipt.json)
          if [ -n "$PREVIOUS_SHA256" ]; then
            args+=(--previous-manifest .cache/indexnow/previous/build-manifest.json --previous-manifest-sha256 "$PREVIOUS_SHA256")
          fi
          python3 scripts/submit_indexnow.py "${args[@]}"
          cp dist/build-manifest.json .cache/indexnow/receipt/build-manifest.json
      - name: Keep the receipt as the next run's baseline
        if: ${{ steps.deploy.outputs.state == 'live' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: indexnow-receipt
          path: .cache/indexnow/receipt/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

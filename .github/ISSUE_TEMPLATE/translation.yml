name: Report a translation correction
description: Correct English or Simplified Chinese wording in a catalog record.
title: "Translation: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for curated descriptions, names or requirements, or scanned repository locales. For dead links or upstream factual changes, use the [resource correction form](https://github.com/reacher-z/Awesome-REA/issues/new?template=broken-resource.yml).

        Preserve names, negation, versions, URLs and capability limits. Do not reproduce intentionally omitted source descriptions.

        Issues are public. Remove tokens, cookies, account identifiers, local filesystem paths and private captures from anything you paste, including logs and screenshots. See the [contribution guide](https://github.com/reacher-z/Awesome-REA/blob/main/CONTRIBUTING.md#review-and-publication), and report security problems privately under the [security policy](https://github.com/reacher-z/Awesome-REA/security/policy).
  - type: input
    id: resource
    attributes:
      label: Resource URL or catalog ID
      description: A public page link with the record's section anchor also works.
    validations:
      required: true
  - type: dropdown
    id: locale
    attributes:
      label: Affected language
      options:
        - English
        - Simplified Chinese
        - Both English and Simplified Chinese
    validations:
      required: true
  - type: dropdown
    id: translation_field
    attributes:
      label: Translation field
      options:
        - Description
        - Resource name
        - Requirements
        - Other text
    validations:
      required: true
  - type: textarea
    id: current_wording
    attributes:
      label: Current wording
      description: Quote the wording currently shown for this field.
    validations:
      required: true
  - type: textarea
    id: expected_wording
    attributes:
      label: Proposed wording
      description: Suggest corrected wording that preserves the source meaning.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this correction needed?
      description: Explain the translation issue and link the public original wording when available. Do not add unsupported capabilities.
    validations:
      required: true
